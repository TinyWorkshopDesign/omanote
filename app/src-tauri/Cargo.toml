[package]
name = "omanote"
version = "0.1.0"
description = "Omanote - quick notes synced with Joplin Server"
authors = ["Michele Belleri"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "omanote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


omanote-core = { path = "../../crates/omanote-core" }
omanote-cli = { path = "../../crates/omanote-cli" }
tokio = { version = "1", features = ["sync", "time"] }
log = "0.4"
chrono = "0.4.45"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"



[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-vision]
version = "0.3"
default-features = false
features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-foundation]
version = "0.3"
default-features = false
features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSError", "NSObject"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
default-features = false
features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"]
