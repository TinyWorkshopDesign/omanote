<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Icon font: blocks on the private-use glyphs rather than falling back. -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/omanote-symbols.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Omanote</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
