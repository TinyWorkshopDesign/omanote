[package]
name = "omanote-core"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6"
aes = "0.9.3"
aes-gcm = "0.11.1"
base64 = "0.23.1"
ccm = "0.6.1"
chrono = "0.4.45"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
indexmap = "2.14.2"
log = "0.4.34"
pbkdf2 = "0.13.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
