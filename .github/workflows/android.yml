# Builds a debug APK for 64-bit ARM phones (aarch64) and keeps it as a workflow
# artifact. Run by hand; nothing is published. Used to install Omanote on a phone
# from a machine that cannot build Android itself (Google ships the NDK and aapt2
# for x86_64 Linux only): `gh run download <run> -n omanote-android-debug`, then
# `adb install -r app-universal-debug.apk`.
#
# Signed with the project's fixed key when the repository secrets
# ANDROID_KEYSTORE_BASE64 (the PKCS12 keystore, alias "omanote") and
# ANDROID_KEYSTORE_PASSWORD are set, so each build installs over the previous one;
# otherwise with the runner's throwaway debug key, which installs over nothing.
# The keystore lives outside the repository (~/.tauri/omanote-android.jks on the
# Omarchy box): never commit it, and losing it means uninstalling to update.

name: android

on:
  workflow_dispatch:
  # Also when this file changes, so a change to the build is tried at once.
  push:
    paths: [.github/workflows/android.yml]

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix app

      - name: Fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: app/src-tauri/gen/android
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No signing secrets: the APK is signed with a throwaway debug key."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > omanote.jks
          printf 'storeFile=omanote.jks\nkeyAlias=omanote\npassword=%s\n' "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build the APK
        working-directory: app
        run: |
          # The runner image ships the Android SDK and NDKs.
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --debug --target aarch64 --apk

      - name: Signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - uses: actions/upload-artifact@v4
        with:
          name: omanote-android-debug
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          retention-days: 14
