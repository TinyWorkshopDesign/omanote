# Builds Omanote for macOS and Linux and attaches the bundles to a draft GitHub
# Release. Runs when a version tag (v0.1.0, …) is pushed, or by hand.
#
# The bundles are signed for the in-app updater (the TAURI_SIGNING_PRIVATE_KEY
# secret; its public half is in tauri.conf.json) and a latest.json listing them is
# attached too: installed apps read it once the draft is published.
#
# macOS: one universal .dmg (Apple Silicon + Intel), ad-hoc signed only: it is not
# notarized, so the first launch has to be allowed in System Settings.
# Linux: AppImage, .deb and .rpm for x86_64 and ARM64 (aarch64, on GitHub's ARM
# runners), built on the oldest supported Ubuntu so the AppImage runs on older glibc
# versions too.
#
# Run by hand with "platforms: linux-arm64" to add only the ARM64 Linux bundles to an
# existing draft release (the version in tauri.conf.json names it): latest.json keeps
# the platforms already listed and gains linux-aarch64.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Which bundles to build
        type: choice
        options: [all, linux-arm64]
        default: all

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'linux-arm64' && '[{"platform":"ubuntu-22.04-arm","args":""}]' || '[{"platform":"macos-latest","args":"--target universal-apple-darwin"},{"platform":"ubuntu-22.04","args":""},{"platform":"ubuntu-22.04-arm","args":""}]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # xdg-utils: the AppImage bundles xdg-open (links, the opener plugin); the x86_64
      # runner image has it already, the ARM64 one does not.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config patchelf xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix app

      - name: Tests
        run: |
          cargo test --workspace --exclude omanote
          npm run --prefix app test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Omanote __VERSION__
          # The body is also copied into latest.json as the update's notes, so it says only
          # what holds for every release. Write what is new at the top of the draft before
          # publishing it.
          releaseBody: |
            **macOS** (Apple Silicon and Intel): download the `.dmg`, drag Omanote to Applications.
            The app is not notarized by Apple yet: on first launch macOS blocks it. Open
            System Settings → Privacy & Security and click "Open Anyway" next to Omanote.

            **Linux**: the `.AppImage` runs on most distributions (`chmod +x`, then run it; on Arch
            and Omarchy it needs `fuse2`). There are also `.deb` and `.rpm` packages.
            On Omarchy, bind `omanote --toggle` in Hyprland and install the bar plugin from
            `omarchy-plugin/` (see the README).

            From 0.3.0 on, the macOS app and the AppImage update themselves (Settings → About).
          releaseDraft: true
          prerelease: false
          # tauri.release.conf.json turns the updater artifacts (and their signing) on.
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
